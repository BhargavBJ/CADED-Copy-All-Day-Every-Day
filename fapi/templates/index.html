<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
            background: #141414;
            color: #eaeaea;
        }

        /* APP */
        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* TOP BAR */
        .topbar {
            padding: 14px 20px;
            border-bottom: 1px solid #232323;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #171717;
        }

        .title {
            font-size: 15px;
            font-weight: 600;
        }

        .clear {
            background: #c96f20;
            color: white;
            padding: 8px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 13px;
        }

        /* CHAT */
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 28px 0;
        }

        .chat-inner {
            max-width: 780px;
            margin: 0 auto;
            padding: 0 18px;
        }

        /* MESSAGE */
        .msg {
            display: flex;
            margin: 10px 0;
        }

        .user {
            justify-content: flex-end;
        }

        .assistant {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 85%;
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 15px;
            line-height: 1.65;
            white-space: pre-wrap;
        }

        .user .bubble {
            background: #c96f20;
            color: white;
        }

        .assistant .bubble {
            background: #1f1f1f;
            border: 1px solid #2a2a2a;
        }

        /* INPUT */
        .input-area {
            position: sticky;
            bottom: 0;
            padding: 14px;
            background: #141414;
            border-top: 1px solid #232323;
        }

        .input-box {
            max-width: 780px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: #1c1c1c;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 10px 12px;
        }

        /* UPLOAD BUTTON */
        .upload-label {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: white;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .upload-label:hover {
            background: #eaeaea;
        }

        input[type="file"] {
            display: none;
        }

        /* TEXTAREA */
        textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            color: #eaeaea;
            font-size: 15px;
            line-height: 1.5;
            max-height: 160px;
        }

        /* SEND */
        button {
            background: #c96f20;
            border: none;
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        /* PREVIEW */
        .preview {
            max-width: 780px;
            margin: 10px auto 0;
            font-size: 12px;
            color: #aaa;
        }

        .preview img {
            max-width: 140px;
            margin-top: 6px;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
        }
    </style>
</head>

<body>

    <div class="app">

        <div class="topbar">
            <div class="title">My AI</div>
            <a class="clear" href="/clear">New chat</a>
        </div>

        <div class="chat">
            <div class="chat-inner">

                {% for msg in messages %}
                <div class="msg {{ msg.role }}">
                    <div class="bubble">
                        {% if msg.role == "assistant" %}
                        {{ msg.content | safe }}
                        {% else %}
                        {{ msg.content }}
                        {% endif %}
                    </div>
                </div>
                {% endfor %}

            </div>
        </div>

        <div class="input-area">

            <form id="form" class="input-box" action="/chat" method="post">

                <!-- FILE UPLOAD FIXED -->
                <input type="file" id="file" accept="image/*" />
                <label for="file" class="upload-label">+</label>

                <textarea name="prompt" id="prompt" placeholder="Message..."></textarea>

                <button type="submit">Send</button>

                <input type="hidden" name="image_base64" id="image_base64" />

            </form>

            <div class="preview" id="preview"></div>

        </div>

    </div>

    <script>

        const file = document.getElementById("file");
        const base64 = document.getElementById("image_base64");
        const prompt = document.getElementById("prompt");
        const preview = document.getElementById("preview");

        file.addEventListener("change", function () {

            const f = this.files[0];
            if (!f) return;

            const reader = new FileReader();

            reader.onload = function (e) {
                const img = e.target.result;

                base64.value = img.split(",")[1];

                preview.innerHTML = `
            <div>Image attached</div>
            <img src="${img}" />
        `;
            };

            reader.readAsDataURL(f);
        });

        prompt.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                document.getElementById("form").submit();
            }
        });

    </script>

</body>

</html>
